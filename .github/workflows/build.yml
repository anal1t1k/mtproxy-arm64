name: Build MTProxy ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            libssl-dev \
            zlib1g-dev

      - name: Clone official MTProxy
        run: |
          git clone --depth 1 https://github.com/TelegramMessenger/MTProxy.git
          cd MTProxy
          git rev-parse HEAD

      - name: Build MTProxy
        run: |
          cd MTProxy
          make -j$(nproc)

      - name: Check binary
        run: |
          file MTProxy/objs/bin/mtproto-proxy
          MTProxy/objs/bin/mtproto-proxy --help || true

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-proxy-arm64
          path: MTProxy/objs/bin/mtproto-proxy
