name: Inspect MTProxy ARM64

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libssl-dev zlib1g-dev

      - name: Clone MTProxy
        run: |
          git clone --depth 1 https://github.com/TelegramMessenger/MTProxy.git

      - name: Show CRC32C source
        run: |
          cd MTProxy

          echo "================ CRC32C SOURCE ================"
          sed -n '350,510p' common/crc32c.c

          echo
          echo "================ X86 REFERENCES ================"

          grep -RniE \
            'rdtsc|__rdtsc|ia32|pclmul|sse42|clmul' \
            common engine mtproto 2>/dev/null | head -100
