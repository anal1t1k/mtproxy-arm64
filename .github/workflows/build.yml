      - name: Patch x86 code for ARM64
        run: |
          cd MTProxy

          python3 <<'PY'
          from pathlib import Path

          # ---------------------------------------------------------
          # CRC32C
          # ---------------------------------------------------------

          p = Path("common/crc32c.c")
          s = p.read_text()

          old = "#ifdef __LP64__"
          new = "#if defined(__x86_64__) || defined(__i386__)"

          if old not in s:
              raise SystemExit("ERROR: CRC32C architecture guard not found")

          s = s.replace(old, new, 1)

          old = "#else\nstatic unsigned crc32c_partial_sse42"
          new = "#elif defined(__i386__)"

          if old not in s:
              raise SystemExit("ERROR: CRC32C i386 branch not found")

          s = s.replace(
              "#else\nstatic unsigned crc32c_partial_sse42",
              "#elif defined(__i386__)\nstatic unsigned crc32c_partial_sse42",
              1
          )

          old = "static unsigned crc32c_combine_clmul (unsigned crc1, unsigned crc2, int64_t len2) {"

          if old not in s:
              raise SystemExit("ERROR: crc32c_combine_clmul not found")

          s = s.replace(
              old,
              "#if defined(__x86_64__) || defined(__i386__)\n" + old,
              1
          )

          old = "static void crc32c_init (void) __attribute__ ((constructor));"

          if old not in s:
              raise SystemExit("ERROR: crc32c_init declaration not found")

          s = s.replace(
              old,
              "#endif\n\n" + old,
              1
          )

          # ARM64 must use the generic CRC32C implementation.
          s = s.replace(
              "  kdb_cpuid_t *p = kdb_cpuid ();\n"
              "  compute_crc32c_combine = &crc32c_combine_generic;\n",
              "  compute_crc32c_combine = &crc32c_combine_generic;\n"
              "#if defined(__x86_64__) || defined(__i386__)\n"
              "  kdb_cpuid_t *p = kdb_cpuid ();\n",
              1
          )

          s = s.replace(
              "    } else {\n"
              "      crc32c_partial = &crc32c_partial_four_tables;\n"
              "    }\n"
              "  }\n",
              "    } else {\n"
              "      crc32c_partial = &crc32c_partial_four_tables;\n"
              "    }\n"
              "#else\n"
              "    crc32c_partial = &crc32c_partial_four_tables;\n"
              "#endif\n"
              "  }\n",
              1
          )

          p.write_text(s)

          # ---------------------------------------------------------
          # mp-queue: x86 mfence -> portable GCC/Clang full barrier
          # ---------------------------------------------------------

          p = Path("common/mp-queue.c")
          s = p.read_text()

          if "mfence" not in s:
              raise SystemExit("ERROR: mfence not found in mp-queue.c")

          s = s.replace(
              'asm volatile ("mfence" ::: "memory");',
              '__sync_synchronize();'
          )

          s = s.replace(
              'asm volatile("mfence" ::: "memory");',
              '__sync_synchronize();'
          )

          p.write_text(s)

          PY

          echo "=== Check mfence ==="
          grep -Rni "mfence" common/mp-queue.c || true

          echo "=== Check CRC32C ==="
          grep -nE '__x86_64__|__i386__|crc32c_partial_four_tables' common/crc32c.c
