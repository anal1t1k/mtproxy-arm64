name: Build MTProxy ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout MTProxy
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/MTProxy
          ref: master
          fetch-depth: 0

      - name: Install ARM64 cross compiler
        run: |
          sudo dpkg --add-architecture arm64

          sudo sed -i \
            -e 's|^deb http://archive.ubuntu.com/ubuntu|deb [arch=amd64] http://archive.ubuntu.com/ubuntu|g' \
            -e 's|^deb http://security.ubuntu.com/ubuntu|deb [arch=amd64] http://security.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list

          sudo apt-get update

          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libssl-dev:arm64 \
            zlib1g-dev:arm64 \
            make \
            git \
            curl \
            xxd

      - name: Show compiler
        run: |
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-gcc -dumpmachine

      - name: Patch ARM64 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("common/crc32c.c")
          s = p.read_text()

          s = s.replace(
              '#if defined(__x86_64__) || defined(__i386__)',
              '#if 0'
          )

          s = s.replace(
              '#if defined(__SSE4_2__)',
              '#if 0'
          )

          p.write_text(s)

          p = Path("common/mp-queue.c")
          s = p.read_text()

          s = s.replace(
              '__sync_synchronize();',
              '__atomic_thread_fence(__ATOMIC_SEQ_CST);'
          )

          p.write_text(s)
          PY

      - name: Build
        env:
          CC: aarch64-linux-gnu-gcc
          AR: aarch64-linux-gnu-ar
          RANLIB: aarch64-linux-gnu-ranlib
          STRIP: aarch64-linux-gnu-strip
        run: |
          make clean || true

          make \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="-O2 -std=gnu11 -Wall -fcommon -fno-strict-aliasing -fno-strict-overflow -fwrapv -DAES=1 -D_GNU_SOURCE=1 -D_FILE_OFFSET_BITS=64" \
            LDFLAGS="-static"

      - name: Verify binary
        run: |
          file objs/bin/mtproto-proxy
          aarch64-linux-gnu-readelf -h objs/bin/mtproto-proxy | grep -E 'Class|Machine'
          aarch64-linux-gnu-readelf -d objs/bin/mtproto-proxy || true

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp objs/bin/mtproto-proxy artifact/
          chmod +x artifact/mtproto-proxy

      - name: Upload MTProxy ARM64
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-proxy-arm64
          path: artifact/mtproto-proxy
