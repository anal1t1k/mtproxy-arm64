name: Build MTProxy ARM64

on:
workflow_dispatch:

jobs:
build:
name: Build MTProxy on ARM64
runs-on: ubuntu-24.04-arm

```
steps:
  - name: Checkout MTProxy
    uses: actions/checkout@v4
    with:
      repository: TelegramMessenger/MTProxy
      ref: master
      fetch-depth: 1

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y git make gcc libc6-dev libssl-dev zlib1g-dev file binutils

  - name: Check system
    run: |
      echo "Architecture:"
      uname -m
      echo
      echo "Compiler:"
      gcc --version
      echo
      echo "Target:"
      gcc -dumpmachine

  - name: Build MTProxy
    run: |
      make clean || true
      make

  - name: Check binary
    run: |
      find . -type f -name 'mtproto-proxy' -o -name 'mtproxy' | head -20
      file objs/bin/mtproto-proxy || true
      readelf -h objs/bin/mtproto-proxy | grep -E 'Class|Machine' || true

  - name: Package
    run: |
      mkdir -p artifact
      cp objs/bin/mtproto-proxy artifact/mtproto-proxy
      chmod +x artifact/mtproto-proxy
      tar -czf mtproxy-arm64.tar.gz -C artifact mtproto-proxy

  - name: Upload binary
    uses: actions/upload-artifact@v4
    with:
      name: mtproxy-arm64
      path: mtproxy-arm64.tar.gz
```
