name: Build MTProxy ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone official MTProxy
        run: |
          git clone https://github.com/TelegramMessenger/MTProxy.git
          cd MTProxy
          git checkout f36d8af769ffaeac36978d38c2c0f6d1104c2137

      - name: Patch Makefile for ARM64
        run: |
          cd MTProxy
          sed -i 's/-mpclmul//g' Makefile
          sed -i 's/-march=core2//g' Makefile
          sed -i 's/-mfpmath=sse//g' Makefile
          sed -i 's/-mssse3//g' Makefile

      - name: Patch CRC32C for ARM64
        run: |
          cd MTProxy

          sed -i '0,/^#ifdef __LP64__$/s//#if defined(__x86_64__) || defined(__i386__)/' common/crc32c.c

          sed -i '0,/^#else$/s//#elif defined(__i386__)/' common/crc32c.c

          sed -i '/^static unsigned crc32c_combine_clmul /i #if defined(__x86_64__) || defined(__i386__)' common/crc32c.c

          sed -i '/^static void crc32c_init (void) __attribute__ ((constructor));/i #endif' common/crc32c.c

          python3 - <<'PY'
          from pathlib import Path

          p = Path("common/crc32c.c")
          s = p.read_text()

          old = """  kdb_cpuid_t *p = kdb_cpuid ();
            compute_crc32c_combine = &crc32c_combine_generic;
            if (p->ecx & (1 << 20)) {
              crc32c_partial = crc32c_partial_sse42;
          #ifdef __LP64__
              if (p->ecx & 2) {
                crc32c_partial = crc32c_partial_sse42_clmul;
                compute_crc32c_combine = &crc32c_combine_clmul;
              }
          #endif
            } else {
              crc32c_partial = &crc32c_partial_four_tables;
            }"""

          new = """  kdb_cpuid_t *p = kdb_cpuid ();
            compute_crc32c_combine = &crc32c_combine_generic;
          #if defined(__x86_64__) || defined(__i386__)
            if (p->ecx & (1 << 20)) {
              crc32c_partial = crc32c_partial_sse42;
          #ifdef __LP64__
              if (p->ecx & 2) {
                crc32c_partial = crc32c_partial_sse42_clmul;
                compute_crc32c_combine = &crc32c_combine_clmul;
              }
          #endif
            } else {
              crc32c_partial = &crc32c_partial_four_tables;
            }
          #else
            crc32c_partial = &crc32c_partial_four_tables;
          #endif"""

          if old not in s:
              raise SystemExit("ERROR: crc32c_init selection block not found")

          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          echo "=== CRC32C ARM64 patch check ==="
          grep -nE '__x86_64__|__i386__|crc32c_partial_four_tables|crc32c_combine_clmul' common/crc32c.c

      - name: Build
        run: |
          cd MTProxy
          rm -rf objs dep
          make -j2

      - name: Check binary
        run: |
          cd MTProxy
          echo "=== Binary ==="
          file objs/bin/mtproto-proxy
          echo "=== Size ==="
          ls -lh objs/bin/mtproto-proxy

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-proxy-arm64
          path: MTProxy/objs/bin/mtproto-proxy
