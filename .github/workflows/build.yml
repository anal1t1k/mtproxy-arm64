      - name: Patch CRC32C for ARM64
        run: |
          cd MTProxy

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("common/crc32c.c")
          s = p.read_text()

          # ---------------------------------------------------------
          # 1. The __LP64__ block is x86-specific.
          # ARM64 also defines __LP64__, so restrict it to x86.
          # ---------------------------------------------------------

          old = "#ifdef __LP64__"
          new = "#if defined(__x86_64__) || defined(__i386__)"

          if old not in s:
              raise SystemExit("ERROR: first __LP64__ guard not found")

          s = s.replace(old, new, 1)

          # ---------------------------------------------------------
          # 2. The #else after the x86-64 implementation is actually
          # the 32-bit x86 implementation.
          # ARM64 must NOT enter this branch.
          # ---------------------------------------------------------

          old = "#else\nstatic unsigned crc32c_partial_sse42"
          new = "#elif defined(__i386__)\nstatic unsigned crc32c_partial_sse42"

          if old not in s:
              raise SystemExit("ERROR: 32-bit x86 CRC32C branch not found")

          s = s.replace(old, new, 1)

          # ---------------------------------------------------------
          # 3. crc32c_combine_clmul() is also x86-specific.
          # Hide it completely on ARM64.
          # ---------------------------------------------------------

          old = "static unsigned crc32c_combine_clmul (unsigned crc1, unsigned crc2, int64_t len2) {"

          if old not in s:
              raise SystemExit("ERROR: crc32c_combine_clmul not found")

          s = s.replace(
              old,
              "#if defined(__x86_64__) || defined(__i386__)\n" + old,
              1
          )

          old = "static void crc32c_init (void) __attribute__ ((constructor));"

          if old not in s:
              raise SystemExit("ERROR: crc32c_init declaration not found")

          s = s.replace(
              old,
              "#endif\n\n" + old,
              1
          )

          # ---------------------------------------------------------
          # 4. Replace the complete crc32c_init() function.
          # ARM64 uses the generic four-table implementation.
          # ---------------------------------------------------------

          pattern = re.compile(
              r"static void crc32c_init \(void\) __attribute__ \(\(constructor\)\);"
              r"\nvoid crc32c_init \(void\) \{.*?\n\}\n"
              r"crc32_partial_func_t crc32c_partial;",
              re.S
          )

          match = pattern.search(s)

          if not match:
              raise SystemExit("ERROR: complete crc32c_init section not found")

          replacement = """static void crc32c_init (void) __attribute__ ((constructor));
          void crc32c_init (void) {
            compute_crc32c_combine = &crc32c_combine_generic;

          #if defined(__x86_64__) || defined(__i386__)
            kdb_cpuid_t *p = kdb_cpuid ();

            if (p->ecx & (1 << 20)) {
              crc32c_partial = crc32c_partial_sse42;

          #ifdef __LP64__
              if (p->ecx & 2) {
                crc32c_partial = crc32c_partial_sse42_clmul;
                compute_crc32c_combine = &crc32c_combine_clmul;
              }
          #endif

            } else {
              crc32c_partial = &crc32c_partial_four_tables;
            }

          #else
            crc32c_partial = &crc32c_partial_four_tables;
          #endif
          }
          crc32_partial_func_t crc32c_partial;"""

          s = s[:match.start()] + replacement + s[match.end():]

          p.write_text(s)

          PY

          echo "=== CRC32C architecture guards ==="
          grep -nE '__x86_64__|__i386__|crc32c_combine_clmul|crc32c_partial_four_tables' common/crc32c.c

          echo "=== CRC32C init ==="
          sed -n '595,660p' common/crc32c.c
