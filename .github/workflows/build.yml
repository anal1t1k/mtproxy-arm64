name: Build MTProxy ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            libssl-dev \
            zlib1g-dev \
            binutils

      - name: Clone MTProxy
        run: |
          git clone --depth 1 https://github.com/TelegramMessenger/MTProxy.git
          cd MTProxy
          git rev-parse HEAD

      - name: Patch Makefile for ARM64
        run: |
          cd MTProxy

          sed -i 's/-mpclmul//g' Makefile
          sed -i 's/-mfpmath=sse//g' Makefile
          sed -i 's/-mssse3//g' Makefile
          sed -i 's/-march=core2//g' Makefile

      - name: Disable x86 CRC32C optimizations
        run: |
          cd MTProxy

          python3 <<'PY'
          from pathlib import Path

          p = Path("common/crc32c.c")
          s = p.read_text()

          # Find the x86 CRC32C implementation.
          start = s.index("static unsigned crc32c_partial_sse42_clmul")
          end = s.index("static unsigned crc32c_partial_sse42", start)

          # Keep the generic implementation and remove the x86 CLMUL
          # implementation from the ARM64 compilation.
          block = s[start:end]

          s = s[:start] + "#if defined(__x86_64__) || defined(__i386__)\n" + block + "#endif\n" + s[end:]

          p.write_text(s)

          print("ARM64 CRC32C patch applied")
          PY

      - name: Disable x86 CRC32C selection
        run: |
          cd MTProxy

          python3 <<'PY'
          from pathlib import Path

          p = Path("common/crc32c.c")
          s = p.read_text()

          # On ARM64 don't select the SSE4.2/CLMUL implementation.
          s = s.replace(
              "crc32c_partial = crc32c_partial_sse42;",
              "#if defined(__x86_64__) || defined(__i386__)\n"
              "      crc32c_partial = crc32c_partial_sse42;\n"
              "#endif"
          )

          s = s.replace(
              "crc32c_partial = crc32c_partial_sse42_clmul;",
              "#if defined(__x86_64__) || defined(__i386__)\n"
              "      crc32c_partial = crc32c_partial_sse42_clmul;\n"
              "#endif"
          )

          p.write_text(s)

          print("CRC32C selection patched")
          PY

      - name: Patch RDTSC for ARM64
        run: |
          cd MTProxy

          python3 <<'PY'
          from pathlib import Path

          p = Path("common/precise-time.h")
          s = p.read_text()

          print("=== precise-time.h ===")
          print(s)
          PY

      - name: Show remaining x86 references
        run: |
          cd MTProxy

          echo "================ X86 REFERENCES ================"

          grep -RniE \
            'rdtsc|__rdtsc|ia32|pclmul|sse42|clmul' \
            common engine mtproto 2>/dev/null || true

      - name: Build MTProxy
        run: |
          cd MTProxy

          make clean || true
          make -j$(nproc)

      - name: Check binary
        run: |
          echo "================ BINARY ================"

          file MTProxy/objs/bin/mtproto-proxy

          echo
          echo "================ ELF ================"

          readelf -h MTProxy/objs/bin/mtproto-proxy | \
            grep -E 'Class|Machine'

          echo
          echo "================ SIZE ================"

          ls -lh MTProxy/objs/bin/mtproto-proxy

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-proxy-arm64
          path: MTProxy/objs/bin/mtproto-proxy
