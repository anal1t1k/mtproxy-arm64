name: Inspect MTProxy ARM64

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Clone
        run: |
          git clone https://github.com/TelegramMessenger/MTProxy.git
          cd MTProxy
          git checkout f36d8af769ffaeac36978d38c2c0f6d1104c2137

      - name: Inspect CRC32C
        run: |
          cd MTProxy

          echo "===== 250-700 ====="
          nl -ba common/crc32c.c | sed -n '250,700p'

          echo "===== CRC functions ====="
          grep -nE '^(static )?(unsigned|uint32_t).*crc32c|crc32c_partial' common/crc32c.c

          echo "===== architecture guards ====="
          grep -nE '#(if|ifdef|ifndef|else|endif)' common/crc32c.c
