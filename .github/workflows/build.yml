name: Build MTProxy ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            libssl-dev \
            zlib1g-dev

      - name: Clone official MTProxy
        run: |
          git clone --depth 1 https://github.com/TelegramMessenger/MTProxy.git
          cd MTProxy
          git rev-parse HEAD

      - name: Patch Makefile for ARM64
        run: |
          cd MTProxy

          echo "=== Original architecture flags ==="
          grep -nE 'mpclmul|mfpmath|mssse3|march=' Makefile || true

          sed -i 's/-mpclmul//g' Makefile
          sed -i 's/-mfpmath=sse//g' Makefile
          sed -i 's/-mssse3//g' Makefile
          sed -i 's/-march=core2//g' Makefile

          echo "=== ARM64 Makefile flags ==="
          grep -nE 'mpclmul|mfpmath|mssse3|march=' Makefile || true

      - name: Build MTProxy
        run: |
          cd MTProxy
          make -j$(nproc)

      - name: Check binary
        run: |
          echo "=== Binary information ==="
          file MTProxy/objs/bin/mtproto-proxy

          echo "=== Architecture ==="
          readelf -h MTProxy/objs/bin/mtproto-proxy | grep -E 'Class|Machine'

          echo "=== Binary size ==="
          ls -lh MTProxy/objs/bin/mtproto-proxy

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-proxy-arm64
          path: MTProxy/objs/bin/mtproto-proxy
