name: Build MTProxy ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build MTProxy on ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout MTProxy
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/MTProxy
          ref: master
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            gcc \
            libc6-dev \
            libssl-dev \
            zlib1g-dev \
            file \
            binutils

      - name: Check ARM64 environment
        run: |
          echo "Architecture:"
          uname -m

          echo "Compiler:"
          gcc --version

          echo "Compiler target:"
          gcc -dumpmachine

      - name: Patch MTProxy for ARM64
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ==================================================
          # crc32c.c
          # Disable x86-specific PCLMUL/SSE implementation
          # on ARM64 and use the generic implementation.
          # ==================================================

          p = Path("common/crc32c.c")
          s = p.read_text()

          # The MTProxy source uses __LP64__ to select the
          # PCLMUL implementation. __LP64__ is also defined
          # on ARM64, so replace this condition with x86_64.
          s = s.replace(
              "#ifdef __LP64__",
              "#if defined(__x86_64__)",
              1
          )

          # Protect the remaining x86 CRC/SSE code.
          s = s.replace(
              "#ifdef __SSE4_2__",
              "#if defined(__x86_64__) && defined(__SSE4_2__)",
          )

          p.write_text(s)

          # ==================================================
          # mp-queue.c
          # Replace x86 mfence with ARM64 barrier.
          # ==================================================

          p = Path("common/mp-queue.c")
          s = p.read_text()

          s = s.replace(
              'asm volatile ("mfence" ::: "memory");',
              'asm volatile ("dmb ish" ::: "memory");'
          )

          s = s.replace(
              'asm volatile("mfence" ::: "memory");',
              'asm volatile ("dmb ish" ::: "memory");'
          )

          p.write_text(s)

          print("ARM64 patches applied")
          PY

      - name: Remove x86 compiler flags
        run: |
          sed -i 's/-mpclmul//g' Makefile
          sed -i 's/-march=core2//g' Makefile
          sed -i 's/-mfpmath=sse//g' Makefile
          sed -i 's/-mssse3//g'

      - name: Build MTProxy
        run: |
          make clean || true

          make \
            CFLAGS="-O2 -std=gnu11 -Wall -fcommon -fno-strict-aliasing -fno-strict-overflow -fwrapv -DAES=1 -D_GNU_SOURCE=1 -D_FILE_OFFSET_BITS=64"

      - name: Verify binary
        run: |
          echo "Binary:"
          file objs/bin/mtproto-proxy

          echo "ELF architecture:"
          readelf -h objs/bin/mtproto-proxy | grep -E 'Class|Machine'

      - name: Package
        run: |
          mkdir -p artifact
          cp objs/bin/mtproto-proxy artifact/mtproto-proxy
          chmod +x artifact/mtproto-proxy

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-proxy-arm64
          path: artifact/mtproto-proxy
