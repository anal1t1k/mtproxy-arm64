name: Build MTProxy ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout MTProxy
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/MTProxy
          ref: master
          path: MTProxy

      - name: Install ARM64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross libssl-dev zlib1g-dev make

      - name: Patch Makefile for ARM64
        working-directory: MTProxy
        run: |
          sed -i 's/-mpclmul//g' Makefile
          sed -i 's/-march=core2//g' Makefile
          sed -i 's/-mfpmath=sse//g' Makefile
          sed -i 's/-mfpmath=sse//g' Makefile
          sed -i 's/-mssse3//g' Makefile

      - name: Build
        working-directory: MTProxy
        run: |
          make clean || true
          make CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar RANLIB=aarch64-linux-gnu-ranlib CFLAGS="-O2 -std=gnu11 -Wall -fcommon -fno-strict-aliasing -fno-strict-overflow -fwrapv -DAES=1 -D_GNU_SOURCE=1 -D_FILE_OFFSET_BITS=64"

      - name: Verify binary
        working-directory: MTProxy
        run: |
          file objs/bin/mtproto-proxy
          aarch64-linux-gnu-readelf -h objs/bin/mtproto-proxy | grep -E 'Class|Machine'

      - name: Package
        run: |
          mkdir -p artifact
          cp MTProxy/objs/bin/mtproto-proxy artifact/
          cp MTProxy/README.md artifact/

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproxy-arm64
          path: artifact/
