name: Build MTProxy ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone official MTProxy
        run: |
          git clone https://github.com/TelegramMessenger/MTProxy.git
          cd MTProxy
          git checkout f36d8af769ffaeac36978d38c2c0f6d1104c2137

      - name: Patch Makefile for ARM64
        run: |
          cd MTProxy

          sed -i 's/-mpclmul//g' Makefile
          sed -i 's/-march=core2//g' Makefile
          sed -i 's/-mfpmath=sse//g' Makefile
          sed -i 's/-mssse3//g' Makefile

      - name: Patch CRC32C for ARM64
        run: |
          cd MTProxy

          python3 <<'PY'
          from pathlib import Path

          p = Path("common/crc32c.c")
          s = p.read_text()

          # __LP64__ is also defined on ARM64, but this block
          # contains x86-specific assembly.
          old = "#ifdef __LP64__"
          new = "#if defined(__x86_64__) || defined(__i386__)"

          if old not in s:
              raise SystemExit("ERROR: architecture guard not found")

          s = s.replace(old, new, 1)

          # On ARM64 the x86 CLMUL implementation does not exist.
          old_selection = "      crc32c_partial = crc32c_partial_sse42_clmul;"

          if old_selection not in s:
              raise SystemExit("ERROR: CLMUL selection not found")

          new_selection = "\n".join([
              "#if defined(__x86_64__) || defined(__i386__)",
              "      crc32c_partial = crc32c_partial_sse42_clmul;",
              "#else",
              "      crc32c_partial = crc32c_partial_four_tables;",
              "#endif"
          ])

          s = s.replace(old_selection, new_selection, 1)

          p.write_text(s)
          PY

          echo "=== CRC32C init ==="
          sed -n '635,665p' common/crc32c.c

      - name: Build
        run: |
          cd MTProxy

          rm -rf objs dep

          make -j2

      - name: Check binary
        run: |
          cd MTProxy

          echo "=== Binary ==="
          file objs/bin/mtproto-proxy

          echo "=== Size ==="
          ls -lh objs/bin/mtproto-proxy

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-proxy-arm64
          path: MTProxy/objs/bin/mtproto-proxy
